services:
  furrbox-backend:
    build:
      context: ./backend
    container_name: furrbox-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      STORAGE_DIR: /app/storage
      DATABASE_URL: file:/app/storage/furrbox.db
      JWT_SECRET: change-this-local-furrbox-secret
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    volumes:
      - furrbox-storage:/app/storage

volumes:
  furrbox-storage:
