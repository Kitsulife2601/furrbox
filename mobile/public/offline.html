<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070812" />
    <title>FurrBox Mobile Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #e5faff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 20% 0%, rgba(0, 240, 255, 0.18), transparent 32%),
          radial-gradient(circle at 100% 10%, rgba(255, 0, 127, 0.16), transparent 34%),
          #070812;
      }
      main {
        width: min(360px, 100%);
        border: 1px solid rgba(0, 240, 255, 0.25);
        border-radius: 28px;
        padding: 24px;
        background: rgba(15, 23, 42, 0.78);
        box-shadow: 0 0 32px rgba(0, 240, 255, 0.18);
        backdrop-filter: blur(20px);
      }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0; color: #94a3b8; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <h1>FurrBox ist offline</h1>
      <p>Die App-Huelle ist geladen, aber der Sync-Server ist gerade nicht erreichbar. Verbinde dich wieder mit dem Netzwerk und lade neu.</p>
    </main>
  </body>
</html>
