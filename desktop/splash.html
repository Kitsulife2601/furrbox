<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>FurrBox</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0c10; color: #f3f4f6; font-family: "Segoe UI", system-ui, sans-serif; }
      body { display: grid; place-items: center; }
      p { margin: 0; text-align: center; }
      .title { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: #4cc2ff; }
      .status { margin-top: 10px; font-size: 14px; color: #b4b8c0; }
      .error { margin-top: 14px; max-width: 520px; font-size: 12px; color: #fca5a5; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div>
      <p class="title">FurrBox</p>
      <p class="status" id="status">Server wird gestartet…</p>
      <p class="error" id="error"></p>
    </div>
    <script>
      window.furrbox?.onStatus?.((text, isError) => {
        document.getElementById(isError ? "error" : "status").textContent = text;
      });
    </script>
  </body>
</html>
