# Builds the FurrBox desktop installer and publishes it as a GitHub Release.
# Installed apps (electron-updater) pick the release up automatically and show the update popup.
#
# New update:  git tag v2.0.1  &&  git push origin v2.0.1
name: Desktop Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web app dependencies
        run: npm ci --ignore-scripts

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Set version from tag
        working-directory: desktop
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Bakes the Discord login into the app so installs work without any setup.
      # Repository secrets: DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET (optional DISCORD_GUILD_ID).
      - name: Bundle Discord login
        working-directory: desktop
        shell: bash
        run: |
          if [ -z "$DISCORD_CLIENT_ID" ] || [ -z "$DISCORD_CLIENT_SECRET" ]; then
            echo "::warning::DISCORD_CLIENT_ID / DISCORD_CLIENT_SECRET fehlen – Installationen müssen Discord selbst einrichten."
            exit 0
          fi
          node -e 'require("fs").writeFileSync("build/discord.json", JSON.stringify({ discordClientId: process.env.DISCORD_CLIENT_ID, discordClientSecret: process.env.DISCORD_CLIENT_SECRET, discordGuildId: process.env.DISCORD_GUILD_ID || "" }))'
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}

      # Create the release up front: electron-builder then uploads into it instead of racing
      # to create one per file (which produced duplicate releases for the same tag).
      # Release notes = the matching entry in src/lib/furr/updates.json (what users see in FurrSettings → Updates).
      - name: Create GitHub release
        shell: bash
        run: |
          node -e '
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const e = require("./src/lib/furr/updates.json").find((u) => u.version === v);
            require("fs").writeFileSync("release-notes.md", e ? e.items.map((i) => "- " + i).join("
") : "");
          '
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "FurrBox Update" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "FurrBox Update" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish installer
        working-directory: desktop
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
