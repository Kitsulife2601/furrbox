# Builds the FurrBox desktop installer and publishes it as a GitHub Release.
# Installed apps (electron-updater) pick the release up automatically and show the update popup.
#
# New update:  git tag v2.0.1  &&  git push origin v2.0.1
name: Desktop Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web app dependencies
        run: npm ci --ignore-scripts

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Set version from tag
        working-directory: desktop
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Create the release up front: electron-builder then uploads into it instead of racing
      # to create one per file (which produced duplicate releases for the same tag).
      - name: Create GitHub release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --title "FurrBox ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish installer
        working-directory: desktop
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
