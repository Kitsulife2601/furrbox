# Builds the FurrBox desktop installer and publishes it as a GitHub Release.
# Installed apps (electron-updater) pick the release up automatically and show the update popup.
#
# New update:  git tag v2.0.1  &&  git push origin v2.0.1
name: Desktop Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web app dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Set version from tag
        working-directory: desktop
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build and publish installer
        working-directory: desktop
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
